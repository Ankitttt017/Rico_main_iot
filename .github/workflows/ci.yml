name: Rico IoT CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - local
  pull_request:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: rico-iot-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: Build frontend and check backend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install native SQL driver prerequisites
        run: |
          sudo sed -i 's/azure.archive.ubuntu.com/archive.ubuntu.com/g' /etc/apt/sources.list /etc/apt/sources.list.d/*.list 2>/dev/null || true
          sudo apt-get update -o Acquire::http::Timeout="10" -o Acquire::Retries="2"
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends unixodbc-dev


      - name: Install and build frontend
        working-directory: Rico_main_iot/frontend
        run: |
          npm ci
          npm run build

      - name: Install and check backend
        working-directory: Rico_main_iot/backend
        run: |
          npm ci
          node --check server.js
          node --check scripts/database-schema.js
          node --check src/modules/plcMonitor/services/plcMonitorService.js
          node --check src/modules/plcMonitor/routes/plcMonitorRoutes.js
          node --check src/modules/plcMonitor/protocols/slmpProtocol.js
          node --check src/modules/plcMonitor/repositories/plcRegisterConfigRepository.js
